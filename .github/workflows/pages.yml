name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # enablement: true 自动启用 Pages 需要仓库管理权限。
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mirror the latest APK onto the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site/downloads
          gh release download --repo "$GITHUB_REPOSITORY" --pattern "*.apk" --dir site/downloads --clobber
          mv site/downloads/*.apk site/downloads/app-release.apk

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未启用 Pages 时自动启用（fork 仓库默认未启用）。
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
