name: Release

# 唯一触发方式：git push origin vXX.XX.XX。标签推送时一次性完成
# 校验、构建、发布；平时 push 不跑任何 CI，也不产出中间制品。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

# 发布流程不可取消：同一个标签只允许一条发布线，且绝不中断进行中的发布。
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # vendor/assists 为 assists 库的 submodule 存档（fork 工作分支），
          # 构建虽走 Maven AAR，但缺 submodule 会让 git 工作树处于脏状态。
          submodules: true

      # 第一道门：标签必须形如 vXX.XX.XX，且打在 laocanmou 分支的最新提交上。
      # GitHub 的 tag 推送事件无法按分支过滤，因此在作业内显式校验，
      # 防止误把 main（上游镜像）或 laocanmou 的旧提交发布出去。
      - name: Verify tag is on laocanmou tip
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::版本标签必须形如 v0.3.0（vXX.XX.XX），当前标签：$TAG"
              exit 1
              ;;
          esac

          # 显式拉取标签到本地（actions/checkout 未必带 tag）。
          git fetch --quiet origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true

          # 标签解引用到 commit；laocanmou 最新提交直接问远端，
          # 不依赖本地 remote-tracking ref（避免 checkout refspec 差异导致失败）。
          TAG_COMMIT="$(git rev-list -n1 "$TAG" 2>/dev/null || true)"
          TIP_COMMIT="$(git ls-remote origin refs/heads/laocanmou | awk '{print $1}')"

          echo "标签 $TAG -> $TAG_COMMIT"
          echo "origin/laocanmou 最新提交 -> $TIP_COMMIT"

          if [ -z "$TAG_COMMIT" ] || [ -z "$TIP_COMMIT" ]; then
            echo "::error::无法解析标签 $TAG 或 laocanmou 分支的提交，请检查网络/权限。"
            exit 1
          fi

          if [ "$TAG_COMMIT" != "$TIP_COMMIT" ]; then
            echo "::error::标签 $TAG 没有指向 laocanmou 分支的最新提交，拒绝发布。"
            echo "请确认：1) laocanmou 已推送到远端；2) 在其最新提交上打标签。"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK platform
        run: |
          SDKMGR="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repository checks
        run: |
          tools/check-license-headers.sh
          tools/check-strings-sync.sh
          python3 tools/check-tool-schemas.py

      # tag 是版本号的唯一事实来源：versionName/versionCode 均由 tag 派生并
      # 注入后续构建（-Pbaic.versionName/-Pbaic.versionCode）。仓库内
      # app/build.gradle.kts 里的值只是本地开发占位，不再参与发布校验。
      # 派生公式：versionCode = 主版本*10000 + 次版本*100 + 补丁号，
      # 对 semver 序天然单调（v0.3.2 -> 302），且远大于历史上手动维护的值。
      - name: Derive version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          V="${TAG#v}"
          BASE="${V%%-*}"   # 剥离预发布后缀：v0.3.2-rc1 -> 0.3.2
          if ! [[ "$BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::标签 $TAG 必须形如 v0.3.2（数字三段式，可带 -rcN 后缀），当前：$BASE"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          if [ "$MINOR" -gt 99 ] || [ "$PATCH" -gt 99 ]; then
            echo "::error::次版本/补丁号超过 99 会使 versionCode 派生不再单调，请升主/次版本。"
            exit 1
          fi
          VER_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          {
            echo "BAIC_VERSION_NAME=$V"
            echo "BAIC_VERSION_CODE=$VER_CODE"
          } >> "$GITHUB_ENV"
          echo "发布 $TAG -> versionName=$V, versionCode=$VER_CODE"

      # GITHUB_TOKEN 无法跨私有仓，必须用 SECRETS_REPO_PAT（主仓唯一 GitHub Secret）。
      - name: Checkout Secrets store
        uses: actions/checkout@v5
        with:
          repository: alwaysgot200/Secrets
          ref: main
          token: ${{ secrets.SECRETS_REPO_PAT }}
          path: secrets-store
          sparse-checkout: ci

      # 把签名信息注入 GITHUB_ENV：过滤掉注释行，只保留 KEY=VALUE。
      - name: Load signing secrets
        run: |
          set -eu
          SECRETS_FILE="secrets-store/ci/baic2-release.env"
          if [ ! -f "$SECRETS_FILE" ]; then
            echo "::error::Secrets 仓库缺少 ci/baic2-release.env，请检查 alwaysgot200/Secrets。"
            exit 1
          fi
          grep -E '^[A-Z0-9_]+=' "$SECRETS_FILE" >> "$GITHUB_ENV"

      - name: Verify signing secrets
        run: |
          set -eu
          MISSING=()
          [ -n "${BAIC2_KEYSTORE_BASE64:-}" ] || MISSING+=("BAIC2_KEYSTORE_BASE64")
          [ -n "${BAIC2_KEYSTORE_PASSWORD:-}" ] || MISSING+=("BAIC2_KEYSTORE_PASSWORD")
          [ -n "${BAIC2_KEY_ALIAS:-}" ] || MISSING+=("BAIC2_KEY_ALIAS")
          [ -n "${BAIC2_KEY_PASSWORD:-}" ] || MISSING+=("BAIC2_KEY_PASSWORD")
          if [ "${#MISSING[@]}" -ne 0 ]; then
            echo "::error::签名信息缺少：${MISSING[*]}。请补全 alwaysgot200/Secrets 的 ci/baic2-release.env 后重跑。"
            exit 1
          fi

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew :app:lintRelease

      - name: Decode release keystore
        run: echo "$BAIC2_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/baic2-release.keystore"

      - name: Build signed release
        env:
          BAIC2_KEYSTORE_PATH: ${{ runner.temp }}/baic2-release.keystore
        run: >-
          ./gradlew :app:assembleRelease
          -Pbaic.versionName="$BAIC_VERSION_NAME"
          -Pbaic.versionCode="$BAIC_VERSION_CODE"

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Verify APK version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort -V | tail -n1)"
          APK_VERSION="$("$AAPT2" dump badging "$APK" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p" | head -n1)"
          echo "成品 APK versionName=$APK_VERSION，发布标签=$TAG"
          if [ "v$APK_VERSION" != "$TAG" ]; then
            echo "::error::成品 APK 版本号 v$APK_VERSION 与发布标签 $TAG 不一致，拒绝发布。"
            exit 1
          fi

      - name: Generate SHA-256 checksum
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/release
          APK="$(ls *.apk | head -n1)"
          sha256sum "$APK" > app-release.apk.sha256

      # 构建产物直接从工作区上传发布，不经过中间制品。
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
          generate_release_notes: true
          draft: false
          # 带连字符的预发布标签（如 v0.3.1-rc1）标记为 prerelease。
          prerelease: ${{ contains(github.ref_name, '-') }}
