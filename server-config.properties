# 好参谋服务器地址（按环境分流，用户不可见）——app/build.gradle.kts 读取，
# 注入 BuildConfig.SERVER_ORIGIN，App 内无任何服务器地址输入口。
#
# server.env 环境开关：
#   留空 = 按构建类型自动分流（debug 包→测试，release 包→生产）；
#   test = 强制测试环境（打真机联调用的 release 签名包时设此值，或构建参数
#          -Pbaic.serverEnv=test 临时指定，不必改本文件）；
#   prod = 强制生产环境。
# 发版/CI 前确认此值为空或 prod，避免测试地址被打进发行包。
server.env=

# 测试环境：本机 autojs6_Management dev 服务器的统一入口（nginx 8080，
# 与生产单域名同构：注册页 /admin/**、API /api/**、LLM 网关 /llm/ 全通；
# 8081 只是后端直连调试口，无 SPA 无 /llm/，客户端不要走它）。
# 默认走 adb reverse（手机 127.0.0.1:8080 -> PC 8080，真机/模拟器通用）；
# Android 明文策略只放行 loopback，若改填局域网 IP（如 http://192.168.10.8:8080）
# 需同步给 app/src/main/res/xml/network_security_config.xml 增加明文白名单。
server.origin.test=http://127.0.0.1:8080

# 生产环境：官方服务器
server.origin.prod=https://autojs6.80fafa.com
