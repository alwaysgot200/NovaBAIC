# 好参谋服务器地址（按环境分流，用户不可见）——app/build.gradle.kts 读取，
# 注入 BuildConfig.SERVER_ORIGIN，App 内无任何服务器地址输入口。
#
# server.env 环境开关：
#   留空 = 按构建类型自动分流（debug 包→测试，release 包→生产）；
#   test = 强制测试环境（打真机联调用的 release 签名包时设此值，或构建参数
#          -Pbaic.serverEnv=test 临时指定，不必改本文件）；
#   prod = 强制生产环境。
# 发版/CI 前确认此值为空或 prod，避免测试地址被打进发行包。
server.env=

# 测试环境：局域网测试服务器 192.168.1.27（GitLab CI 构建部署，与生产单域名同构：
# 注册页 /admin/**、API /api/**、LLM 网关 /llm/ 全通；统一 80 端口，不再走 adb reverse）。
# 手机/模拟器需与 1.27 在同一局域网；Android 明文策略已放行该 IP
# （见 app/src/main/res/xml/network_security_config.xml）。
server.origin.test=http://192.168.1.27

# 生产环境：官方服务器
server.origin.prod=https://autojs6.80fafa.com
